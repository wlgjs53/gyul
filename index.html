<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귤하르방 투어</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; background: #f8f3e9; color: #1f3a4d; }
        .hero {
            position: relative; overflow: hidden; padding: 56px 20px 96px; color: #fff; text-align: center;
            background:
                radial-gradient(circle at 80% 15%, rgba(255,226,140,.65), transparent 45%),
                linear-gradient(150deg, #e8591a, #f2862a 55%, #f7b13f);
        }
        .hero-txt { position: relative; z-index: 2; }
        .eyebrow { letter-spacing: .35em; font-size: 12px; color: #fff3d6; font-weight: 700; margin-bottom: 8px; }
        .hero h1 { margin: 0 0 10px; font-size: clamp(28px, 5.5vw, 46px); text-shadow: 0 3px 12px rgba(120,40,0,.45); }
        .hero p { margin: 0; opacity: .95; }
        .wave { position: absolute; left: 0; bottom: -1px; width: 100%; height: 56px; z-index: 1; }
        .hb { position: absolute; bottom: 30px; width: 96px; height: 144px; z-index: 2; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
        /* 좌우 대칭이 되지 않게: 왼쪽은 크고 살짝 기울고, 오른쪽은 작고 안쪽에 서 있다 */
        .hb.left { left: 4%; bottom: 24px; width: 118px; height: 177px; transform: rotate(-4deg); }
        .hb.right { right: 13%; bottom: 40px; width: 74px; height: 111px; transform: rotate(6deg); }
        .fruit { position: absolute; z-index: 1; font-size: 34px; animation: bob 5s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
        .f1 { left: 17%; top: 20%; } .f2 { right: 9%; top: 26%; animation-delay: -1.5s; font-size: 28px; }
        .f3 { left: 27%; bottom: 30%; animation-delay: -3s; font-size: 24px; }
        .f4 { right: 24%; bottom: 24%; animation-delay: -2s; font-size: 30px; }
        .f5 { left: 5%; top: 12%; animation-delay: -4s; font-size: 28px; }
        @keyframes bob { 50% { transform: translateY(-12px) rotate(8deg); } }
        @media (max-width: 700px) { .hb.left { width: 70px; height: 105px; bottom: 30px; } .hb.right { width: 46px; height: 69px; bottom: 40px; right: 8%; } .fruit { font-size: 22px; } }
        .wrap { max-width: 1100px; margin: -52px auto 0; padding: 0 16px 0; position: relative; z-index: 3; }

        .panel { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 8px 24px rgba(15,60,90,.14); border-top: 5px solid #f08a24; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
        .row[hidden] { display: none; }
        .row b { font-size: 13px; color: #5a7387; min-width: 54px; }
        .pill {
            border: 1px solid #c9d9e4; background: #fff; color: #27506d; border-radius: 99px;
            padding: 6px 14px; font-size: 14px; cursor: pointer; font-family: inherit;
        }
        .pill:hover { background: #eaf4f9; }
        .pill.on { background: #f08a24; color: #fff; border-color: #f08a24; }
        .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .tools input, .tools select {
            padding: 10px 12px; border: 1px solid #c9d9e4; border-radius: 10px; font-size: 15px; font-family: inherit;
        }
        .tools input { flex: 1; min-width: 180px; }
        .count { margin: 18px 4px 10px; color: #4a6479; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(15,60,90,.1); display: flex; flex-direction: column; transition: transform .2s; }
        .card:hover { transform: translateY(-4px); }
        .pic { position: relative; height: 160px; display: flex; align-items: center; justify-content: center; font-size: 54px; background: linear-gradient(135deg, #7fc4d6, #3a8fa8); }
        .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .tag { position: absolute; left: 10px; top: 10px; z-index: 1; font-size: 12px; font-weight: 700; color: #fff; padding: 3px 10px; border-radius: 12px; background: rgba(0,0,0,.55); }
        .tag.food { background: rgba(214, 90, 30, .9); }
        .star {
            position: absolute; right: 8px; top: 6px; z-index: 1; border: 0; background: rgba(255,255,255,.85);
            width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; line-height: 1;
        }
        .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .body h3 { margin: 0; font-size: 17px; }
        .meta { font-size: 13px; color: #5a7387; }
        .desc { font-size: 13.5px; line-height: 1.55; color: #2c4a60; flex: 1; }
        .info { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #4a6479; }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip { padding: 3px 10px; border-radius: 12px; background: #eef3f6; color: #3d5a70; font-weight: 600; }
        .chip.in { background: #e3ecff; color: #2b55b0; }
        .chip.out { background: #e1f4e8; color: #1f7a45; }
        .hours { background: #fff4e5; color: #9a5a10; padding: 5px 10px; border-radius: 10px; font-weight: 600; }
        .wx { padding: 5px 10px; border-radius: 10px; background: #fdf1e3; color: #a1541a; font-weight: 600; }
        .links { display: flex; gap: 12px; font-size: 13px; }
        .links a { color: #167a8f; font-weight: 700; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .empty { text-align: center; padding: 50px 0; color: #5a7387; }
        /* 양옆 풍경: 카드 영역 양옆을 꽉 채우는 두 개의 띠. 안의 장식은 띠 기준 %로 흩어 놓고, 크기는 --k (화면 폭에 맞춰 JS 가 계산)로 함께 커지고 작아진다 */
        :root { --k: .85; }
        .band { position: fixed; top: 0; bottom: 0; width: calc(50% - 556px); display: none; z-index: 0; pointer-events: none; overflow: hidden; }
        .band-l { left: 0; } .band-r { right: 0; }
        @media (min-width: 1500px) { .band { display: block; } }
        .it { position: absolute; width: calc(var(--w) * var(--k) * 1px); height: auto; translate: -50% -50%; transform: rotate(var(--r, 0deg)); }
        .it.hb { filter: drop-shadow(0 6px 8px rgba(0,0,0,.28)); }
        .it.sway { animation: sway 6s ease-in-out infinite; }
        .it.hop { animation: hop 3.4s ease-in-out infinite; }
        .it.tilt { animation: tilt 4.8s ease-in-out infinite; }
        .it.grass { transform-origin: bottom center; animation: grass 5s ease-in-out infinite; }
        .it.float { animation: float 4.5s ease-in-out infinite; }
        .b-wall { position: absolute; left: -2%; bottom: 0; width: 104%; height: 14vh; }
        .b-sea { position: absolute; left: -4%; bottom: 0; width: 108%; height: 26vh; animation: seaMove 6s ease-in-out infinite; }
        .b-boat { position: absolute; left: 46%; bottom: 12vh; width: calc(74px * var(--k)); height: auto; translate: -50% 0; transform-origin: bottom center; animation: boat 4.5s ease-in-out infinite; }
        .b-dol { position: absolute; height: auto; translate: -50% 0; }
        .b-dol.d1 { left: 20%; bottom: 10vh; width: calc(86px * var(--k)); animation: jump 6s ease-in-out infinite; }
        .b-dol.d2 { left: 72%; bottom: 9vh; width: calc(62px * var(--k)); animation: jump 7.5s ease-in-out infinite -3.5s; }
        @keyframes sway { 50% { transform: rotate(calc(var(--r) + 5deg)) translateY(-4px); } }
        @keyframes hop { 0%, 100% { transform: rotate(var(--r)) translateY(0); } 45% { transform: rotate(calc(var(--r) - 6deg)) translateY(-16px); } 60% { transform: rotate(calc(var(--r) + 4deg)) translateY(-16px); } }
        @keyframes tilt { 50% { transform: rotate(calc(var(--r) - 12deg)); } }
        @keyframes grass { 50% { transform: rotate(calc(var(--r, 0deg) + 3deg)); } }
        @keyframes float { 50% { transform: translateY(-9px) rotate(calc(var(--r) + 8deg)); } }
        @keyframes seaMove { 50% { transform: translateX(-9px); } }
        @keyframes boat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
        /* 돌고래: 물속에서 솟아올라 호를 그리며 뛰고, 다시 물속으로 들어간다 */
        @keyframes jump {
            0% { transform: translate(0, 34px) rotate(-35deg); opacity: 0; }
            8% { opacity: 1; }
            38% { transform: translate(20px, -50px) rotate(-10deg); opacity: 1; }
            58% { transform: translate(38px, -38px) rotate(28deg); opacity: 1; }
            80% { transform: translate(52px, 26px) rotate(58deg); opacity: 1; }
            90%, 100% { transform: translate(56px, 38px) rotate(62deg); opacity: 0; }
        }
                /* 돌담 위의 귤하르방 */
        .wall-hb { top: -74px; bottom: auto; }
        .wall-hb.w1 { left: 8%; width: 70px; height: 105px; transform: rotate(-3deg); }
        .wall-hb.w2 { left: 46%; width: 54px; height: 81px; top: -58px; transform: rotate(4deg); }
        .wall-hb.w3 { right: 9%; width: 78px; height: 117px; top: -82px; transform: rotate(3deg); }
        .pic { cursor: pointer; }
        .hint { position: absolute; left: 50%; bottom: 10px; transform: translate(-50%, 8px); z-index: 1; opacity: 0; transition: .2s;
            font-size: 13px; font-weight: 700; color: #fff; background: rgba(232,89,26,.92); padding: 5px 14px; border-radius: 16px; white-space: nowrap; }
        .pic:hover .hint { opacity: 1; transform: translate(-50%, 0); }
        .mapdlg { border: 0; border-radius: 20px; padding: 22px 22px 18px; width: min(360px, calc(100vw - 32px)); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35); border-top: 6px solid #f08a24; }
        .mapdlg::backdrop { background: rgba(20,30,40,.55); }
        .mapdlg h2 { margin: 0 0 4px; font-size: 20px; }
        .mapdlg p { margin: 0 0 14px; font-size: 13px; color: #5a7387; }
        .mapbtns { display: grid; gap: 8px; margin-bottom: 12px; }
        .mapbtns a { display: block; padding: 11px; border-radius: 12px; text-decoration: none; font-weight: 700; color: #fff; }
        .mapbtns a.g { background: #3b7ddd; } .mapbtns a.n { background: #1fb560; }
        .mapbtns a.k { background: #f2c200; color: #3a2e00; } .mapbtns a.d { background: #e8591a; }
        .card { border: 2px solid transparent; }
        .card:hover { border-color: #f08a24; box-shadow: 0 10px 22px rgba(240,138,36,.25); }
        .count::before { content: '🍊 '; }
        .body h3::after { content: ''; }
        .note { padding-bottom: 8px; }
        /* 돌담: 현무암 돌을 쌓은 모양 */
        .wall { margin-top: 34px; position: relative; padding: 34px 16px 30px; text-align: center; color: #efe9dc; font-size: 14px;
            background:
                radial-gradient(ellipse 26px 17px at 26px 17px, #6a6a6a 96%, transparent 100%) 0 0 / 52px 34px,
                radial-gradient(ellipse 26px 17px at 0 34px, #5a5a5a 96%, transparent 100%) 0 0 / 52px 34px,
                #3b3b3b; }
        .wall-txt { display: inline-block; background: rgba(30,30,30,.82); padding: 8px 18px; border-radius: 20px; }
        .note { margin-top: 30px; font-size: 12.5px; color: #5a7387; line-height: 1.7; }
    </style>
</head>

        // ---- 지금 날씨 (Open-Meteo, 키 불필요). 지역별 중심 좌표로 한 번에 가져온다 ----
        const weather = {}
        const AREA_XY = { 제주시: [33.51, 126.52], 서쪽: [33.36, 126.30], 서귀포: [33.25, 126.56], 동쪽: [33.46, 126.88] }
        function wxIcon(c) {
            if (c === 0) return '☀️'
            if (c <= 3) return '⛅'
            if (c <= 48) return '🌫️'
            if (c <= 67) return '🌧️'
            if (c <= 77) return '❄️'
            if (c <= 82) return '🌦️'
            if (c <= 86) return '❄️'
            return '⛈️'
        }
        async function loadWeather() {
            try {
                const names = Object.keys(AREA_XY)
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + names.map(n => AREA_XY[n][0]).join(',') +
                    '&longitude=' + names.map(n => AREA_XY[n][1]).join(',') + '&current=temperature_2m,weather_code&timezone=Asia%2FSeoul'
                const d = await (await fetch(url)).json()
                names.forEach((n, k) => {
                    const c = d[k].current
                    weather[n] = { temp: Math.round(c.temperature_2m), icon: wxIcon(c.weather_code), rain: c.weather_code >= 51 }
                })
                draw()
            } catch (e) { /* 날씨를 못 가져오면 날씨 줄만 보이지 않는다 */ }
        }

        // 영업시간(OSM 형식)을 한글로: We-Mo 11:00-21:00 -> 수~월 11:00~21:00
        function hoursKo(s) {
            const D = { Mo: '월', Tu: '화', We: '수', Th: '목', Fr: '금', Sa: '토', Su: '일', PH: '공휴일' }
            return s.replace('Mo-Su', '매일').replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g, m => D[m])
                .replace(/([가-힣])-([가-힣])/g, '$1~$2').replace(/(\d)-(\d)/g, '$1~$2').replace(/;/g, ' /')
        }

        function pills(boxId, values, key) {
            const box = $(boxId)
            box.textContent = ''
            for (const v of values) {
                const b = document.createElement('button')
                b.className = 'pill' + (state[key] === v ? ' on' : '')
                b.textContent = v
                b.onclick = () => { state[key] = v; if (key === 'kind') { state.cat = '전체'; state.env = '전체' } draw() }
                box.append(b)
            }
        }

        function draw() {
            // 구분에 맞는 분류만 버튼으로 보여 준다 (item.category 로 반복)
            const inKind = items.filter(i => state.kind === '전체' || i.kind === state.kind)
            const cats = ['전체']
            for (const i of inKind) if (!cats.includes(i.category)) cats.push(i.category)
            pills('kindBtns', ['전체', '관광지', '맛집'], 'kind')
            pills('areaBtns', ['전체', '동쪽', '서쪽', '서귀포', '제주시'], 'area')
            pills('catBtns', cats, 'cat')
            pills('envBtns', ['전체', '실내', '야외'], 'env')
            $('catRow').hidden = state.kind === '전체'     // 구분을 고르기 전에는 분류 버튼을 숨긴다
            $('envRow').hidden = state.kind !== '관광지'   // 실내/야외는 관광지에만 있다

            const q = state.q.trim().toLowerCase()
            let list = inKind.filter(i =>
                (state.area === '전체' || i.area === state.area) &&
                (state.cat === '전체' || i.category === state.cat) &&
                (state.env === '전체' || (state.env === '실내') === i.indoor) &&
                (!state.favOnly || fav.has(i.name)) &&
                (!q || (i.name + ' ' + i.description).toLowerCase().includes(q)))

            if (state.sort === 'score') list = list.slice().sort((a, b) => b.score - a.score)
            else if (state.sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'))

            $('count').textContent = `${list.length}곳이 검색되었습니다`
            $('favOnly').classList.toggle('on', state.favOnly)

            const grid = $('grid')
            grid.textContent = ''
            if (list.length === 0) {
                const p = document.createElement('div')
                p.className = 'empty'
                p.textContent = '조건에 맞는 곳이 없어요. 필터를 바꿔 보세요.'
                grid.append(p)
                return
            }
            for (const i of list) grid.append(card(i))
        }

        function card(i) {
            const c = document.createElement('article')
            c.className = 'card'

            const pic = document.createElement('div')
            pic.className = 'pic'
            pic.textContent = ICON[i.category] || '🌴'
            if (i.image) {
                const img = document.createElement('img')
                img.alt = i.name
                img.referrerPolicy = 'no-referrer'
                img.onload = () => pic.prepend(img)          // 불러오는 데 성공했을 때만 사진을 보여 준다
                img.src = i.image
            }
            const tag = document.createElement('span')
            tag.className = 'tag' + (i.kind === '맛집' ? ' food' : '')
            tag.textContent = i.kind + ' · ' + i.category
            const star = document.createElement('button')
            star.className = 'star'
            star.title = '가 보고 싶은 곳'
            star.textContent = fav.has(i.name) ? '⭐' : '☆'
            star.onclick = (e) => {
                e.stopPropagation()                           // 별을 눌렀을 때는 지도 창이 열리지 않게 한다
                if (fav.has(i.name)) fav.delete(i.name); else fav.add(i.name)
                saveFav()
                draw()
            }
            const hint = document.createElement('span')
            hint.className = 'hint'
            hint.textContent = '📍 가는 방법 보기'
            pic.append(tag, star, hint)
            pic.title = i.name + ' 지도 · 가는 방법'
            pic.onclick = () => openMap(i)

            const body = document.createElement('div')
            body.className = 'body'
            const h = document.createElement('h3')
            h.textContent = i.name
            const meta = document.createElement('div')
            meta.className = 'meta'
            meta.textContent = '📍 ' + i.area
            const desc = document.createElement('div')
            desc.className = 'desc'
            desc.textContent = i.description
            // 아래 정보줄: 관광지는 실내/야외 + 유형 태그, 맛집은 영업시간, 둘 다 지역의 지금 날씨
            const info = document.createElement('div')
            info.className = 'info'
            const chips = document.createElement('div')
            chips.className = 'chips'
            const chip = (text, cls) => {
                const s = document.createElement('span')
                s.className = 'chip' + (cls ? ' ' + cls : '')
                s.textContent = text
                chips.append(s)
            }
            if (i.kind === '관광지') {
                chip(i.indoor ? '🏠 실내' : '🌳 야외', i.indoor ? 'in' : 'out')
                for (const t of i.tags || []) chip('#' + t)
                info.append(chips)
            } else {
                const hrs = document.createElement('div')
                hrs.className = 'hours'
                hrs.textContent = i.hours ? '🕒 ' + hoursKo(i.hours) : '🕒 영업시간 정보 없음'
                info.append(hrs)
            }
            const w = weather[i.area]
            if (w) {
                const wl = document.createElement('div')
                wl.className = 'wx'
                let line = `${w.icon} 지금 ${i.area} ${w.temp}°C`
                if (i.kind === '관광지') {
                    if (w.rain) line += i.indoor ? ' · 비 와도 괜찮아요' : ' · 비가 와요, 실내가 나아요'
                    else line += i.indoor ? ' · 날씨와 상관없이 좋아요' : ' · 야외 나들이 좋아요'
                }
                wl.textContent = line
                info.append(wl)
            }
            const links = document.createElement('div')
            links.className = 'links'
            const src = document.createElement('a')
            src.href = i.source
            src.target = '_blank'
            src.rel = 'noopener'
            src.textContent = '출처 보기'
            links.append(src)
            if (i.website) {
                const w = document.createElement('a')
                w.href = i.website
                w.target = '_blank'
                w.rel = 'noopener'
                w.textContent = '가게 사이트'
                links.append(w)
            }
            const map = document.createElement('a')
            map.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('제주 ' + i.name)
            map.target = '_blank'
            map.rel = 'noopener'
            map.textContent = '지도'
            links.append(map)

            body.append(h, meta, desc, info, links)
            c.append(pic, body)
            return c
        }

        // 사진을 누르면 지도 · 가는 방법 창을 연다 (장소 이름으로 검색하는 링크)
        function openMap(i) {
            const q = encodeURIComponent('제주 ' + i.name)
            $('mapTitle').textContent = i.name
            $('mapSub').textContent = '📍 ' + i.area + ' · 아래에서 지도를 고르세요'
            const links = [
                ['g', '🗺️ 구글 지도에서 보기', 'https://www.google.com/maps/search/?api=1&query=' + q],
                ['d', '🚗 구글 지도 길찾기 (가는 방법)', 'https://www.google.com/maps/dir/?api=1&destination=' + q],
                ['n', '🟢 네이버 지도에서 보기', 'https://map.naver.com/p/search/' + q],
                ['k', '🟡 카카오맵에서 보기', 'https://map.kakao.com/?q=' + q],
            ]
            const box = $('mapBtns')
            box.textContent = ''
            for (const [cls, label, href] of links) {
                const a = document.createElement('a')
                a.className = cls
                a.href = href
                a.target = '_blank'
                a.rel = 'noopener'
                a.textContent = label
                box.append(a)
            }
            const dlg = $('mapDlg')
            if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '')
        }
        $('mapClose').onclick = () => $('mapDlg').close()
        $('mapDlg').onclick = (e) => { if (e.target === $('mapDlg')) $('mapDlg').close() }   // 바깥을 누르면 닫힘

        $('q').oninput = (e) => { state.q = e.target.value; draw() }
        $('sort').onchange = (e) => { state.sort = e.target.value; draw() }
        $('favOnly').onclick = () => { state.favOnly = !state.favOnly; draw() }
        $('note').textContent = DATA.note + ' 관심도(score)는 개인이 정한 값이며 실제 평점이 아닙니다.'

        // 양옆 풍경의 크기: 양옆 여백(띠) 폭에 비례해 키우고 줄인다
        function fitBands() {
            const w = Math.max(0, (innerWidth - 1112) / 2)
            document.documentElement.style.setProperty('--k', Math.min(1.3, Math.max(.5, w / 400)))
        }
        fitBands()
        addEventListener('resize', fitBands)

        draw()
        loadWeather()
    </script>
</body>
</html>
